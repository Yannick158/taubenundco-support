name: "Report a bug / Fehler melden"
description: "Something does not work as expected. / Etwas funktioniert nicht wie erwartet."
title: "[Fehler] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Please do not post private data**: no passwords, no addresses, no exact locations, no IP addresses. Blur them in screenshots.
        **Bitte keine privaten Daten posten**: keine Passwörter, keine Adressen, keine genauen Standorte, keine IP-Adressen. In Screenshots unkenntlich machen.
  - type: textarea
    id: what
    attributes:
      label: "What happened? / Was ist passiert?"
      description: "What did you expect instead? / Was hast du stattdessen erwartet?"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "App version / App-Version"
      description: "Shown under About in the app. / Steht in der App unter „Über“."
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: "Device and system / Gerät und System"
      placeholder: "e.g. iPhone 15, iOS 19 / z. B. Pixel 8, Android 16"
    validations:
      required: true
  - type: dropdown
    id: station
    attributes:
      label: "Station type / Stationstyp"
      options:
        - BirdNET-Pi / AvianVisitors
        - BirdNET-Go
        - Phone microphone / Handy-Mikrofon
        - Other / Andere
        - None / Keine
    validations:
      required: true
